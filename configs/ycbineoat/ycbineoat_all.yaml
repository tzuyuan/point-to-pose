dense_register:
  type: cupoch_icp
  params:
    icp_type: point_to_plane
    min_num_points: 5
    max_num_points: 10000
    max_correspondence_distance: 0.05
    max_iterations: 30
    epsilon: 1e-6
    debug_level: 0
    debug_dir: /home/justin/code/point-to-pose/debug/dense_register

segmenter:
  type: sam2
  params:
    model_cfg: configs/sam2.1/sam2.1_hiera_l.yaml
    checkpoint: /home/justin/code/point-to-pose/checkpoints/sam2.1/sam2.1_hiera_large.pt
    device: cuda

tracker:
  type: tapir
  params:
    resize_height: 480
    resize_width: 480
    visible_threshold: 0.5
    device: cuda
    checkpoint_path: /home/justin/code/point-to-pose/checkpoints/tapir/causal_bootstapir_checkpoint.pt
 
  
