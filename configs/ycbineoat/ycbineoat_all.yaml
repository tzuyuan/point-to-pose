register:
  type: svd_cluster_ransac
  params:
    ransac_iters: 100
    sample_size: 4
    inlier_thres: 0.005
    min_inliers: 5
    max_clusters: 10
    use_uncertainty: true
    min_variance: 1e-2

    # reproj_error, dist_to_prev, inlier_count, mean_residual, reproj_error_iou, 3d_dist, 3d_dist_prev_kf, 3d_dist_sparse_map, 3d_dist_dense_map
    select_method: 3d_dist_dense_map
    select_3d_dist_min_depth: 0.08
    select_3d_dist_max_depth: 1.5
    select_3d_dist_fill_missing_depth: true
    select_3d_dist_window_size: 5
    select_3d_dist_min_neighbors: 1
    select_dense_map_close_margin: 1e-3

    # front end
    remove_outside_mask: true
    uncer_thres: 0.3
    residual_thres: 0.007

