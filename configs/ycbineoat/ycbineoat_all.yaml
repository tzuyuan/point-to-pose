sampler: 
  type: uniform_fps
  params:
    num_points: 25
    density_per_kpx: -1
    fps_oversample_factor: 3

    min_points: 5
    max_points: 50
    edge_margin_px: 5
    remove_convex_hull: false
    inflate_points: false
    inflate_radius_px: 20

    cell_size: -1

    crop_to_mask: true
    crop_pad_px: 3

    super_point_max_num_keypoints: 512

    debug_level: 0
    debug_dir: /home/justin/code/point-to-pose/debug/sampler
    debug_save_superpoint: false

criterion:
  ### criterion types: 
  ###      iteration, registration_residual, 
  ###      uncertainty_ratio, uncertainty_number, 
  ###      rotation_grid, rotation_threshold
  ###      mask_area
  type: rotation_threshold_and_min_num
  params:
    # iteration criterion
    update_per_iter: 1000000

    # residual criterion
    residual_thres: 0.02

    # uncertainty criterion
    uncer_thres: 0.3
    min_num_pts: 20

    # rotation threshold and min num criterion
    # if it's smaller than this it will not trigger sampling
    min_mask_area: 100  

    # rotation grid criterion
    discretization_angle: 60

    # rotation threshold criterion
    max_angle_deg: 10

    # mask area criterion
    fit_mode: convex
    ratio_threshold: 0.6
    debug_viz: false
    debug_dir: /home/justin/code/point-to-pose/debug/criterion

local_optimizer:
  type: lm_graph
  params:
    local_graph_max_num_frames: 120
    max_iterations: 20
    relative_error_tol: 1e-5
    absolute_error_tol: 1e-5
    prior_noise_param: [1e-6, 1e-6, 1e-6, 1e-6, 1e-6, 1e-6]
    uncertainty_thres: 0.3
    uncertainty_min: 1e-2
    use_between_factor: true
    landmark_sigma_scale_by: residual
    landmark_sigma_min: 1e-3
    landmark_huber_k: 1.0

global_optimizer:
  type: lm_graph
  params:
    relinearize_threshold: 0.1
    relinearize_skip: 1
    relative_error_tol: 1e-5
    absolute_error_tol: 1e-5
    prior_noise_param: [1e-6, 1e-6, 1e-6, 1e-6, 1e-6, 1e-6]
    uncertainty_thres: 0.3
    uncertainty_min: 1e-2
    use_between_factor: true
    landmark_sigma_scale_by: residual
    landmark_sigma_min: 1e-3
    landmark_huber_k: 1.0

visualization:
  params:
    visualize_points: true
    # uncertainty, visible, visible_uncertainty, frame_id
    points_vis_method: visible_uncertainty
    save_images: True
    output_image_dir: /home/justin/code/point-to-pose/debug/output_images