

pipeline:
  type: modular
  params:
    max_num_obj: 1
    estimate_init_pose: false

    use_segmenter: true

    # depth related
    fill_missing_depth: true
    fill_missing_depth_window_size: 5
    fill_missing_depth_min_neighbors: 1
    min_depth: 0.1
    max_depth: 1.5

    use_depth_estimate: false
    depth_estimator_type: depth_anything
    device: cuda
    depth_encoder: vitl

    max_rel_rotation_deg: 15
    max_rel_translation: 0.03

    kf_gating: true
    anchor_rot_deg: 15.0
    anchor_trans: 0.05
    anchor_min_inliers: 10
    anchor_min_inlier_ratio: 0.001
    anchor_max_median_res: 1.0
    anchor_vel_hist_len: 5
    anchor_vel_rot_deg: 300.0
    anchor_vel_trans: 100.0

    sdf_kf_gate : false
    sdf_kf_gate_thres: 0.05
    sdf_kf_gate_percentile: 70.0
    sdf_kf_gate_min_dense: 200

    frame_reg_mode: f2m
    use_dense_registration: false
    use_local_graph: true

    debug_level: 0
    debug_dir: /home/justin/code/point-to-pose/debug/
    save_pose: true
    pose_save_path: /home/justin/code/point-to-pose/debug/poses
    save_key_points: false
    key_points_save_path: /home/justin/code/point-to-pose/debug/key_points
    save_meta_data: true
    meta_data_save_path: /home/justin/code/point-to-pose/debug/pipeline/meta_data
    save_cropped_pcd: false
    cropped_pcd_dir: /home/justin/code/point-to-pose/debug/cropped_pcd

reconstructor:
  type: sdf_builder
  params:
    build_sdf_after_global_opt: true
    sdf_use_gpu: true
    # nvblox, tsdf_python
    sdf_backend: nvblox
    sdf_voxel_size: 0.005
    sdf_bounds_padding: 0.02
    sdf_min_points: 300
    sdf_filter_max_radius: 0.25
    sdf_filter_keep_percentile: 98.0
    sdf_fuse_color: true



