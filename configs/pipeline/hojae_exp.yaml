sampler: 
  type: super_point_balanced
  params:
    num_points: 30
    density_per_kpx: -1
    fps_oversample_factor: 2

    min_points: 5
    max_points: 50
    edge_margin_px: 2
    remove_convex_hull: false
    inflate_points: false
    inflate_radius_px: 20

    cell_size: -1

    crop_to_mask: true
    crop_pad_px: 0

    super_point_max_num_keypoints: 512

    sample_filter_enable: true
    sample_require_depth_valid: true
    sample_reject_depth_edge: true
    sample_depth_edge_window: 2        # 3x3 patch
    sample_depth_edge_thres: 0.01      # meters depth span
    sample_min_pixel_dist_existing: 6.0
    sample_min_pixel_dist_new: 4.0
    sample_max_per_obj: 0              # 0 = no cap

    debug_level: 0
    debug_dir: /home/manipulator/git/point-to-pose/debug/sampler
    debug_save_superpoint: false

criterion:
  ### criterion types: 
  ###      iteration, registration_residual, 
  ###      uncertainty_ratio, uncertainty_number, 
  ###      rotation_grid, rotation_threshold
  ###      mask_area
  type: rotation_threshold_and_min_num
  params:
    # iteration criterion
    update_per_iter: 1000000

    # residual criterion
    residual_thres: 0.02

    # uncertainty criterion
    uncer_thres: 0.3
    min_num_pts: 0

    # rotation threshold and min num criterion
    # if it's smaller than this it will not trigger sampling
    min_mask_area: 100  

    # rotation grid criterion
    discretization_angle: 60

    # rotation threshold criterion
    max_angle_deg: 20

    # mask area criterion
    fit_mode: convex
    ratio_threshold: 0.6
    debug_viz: false
    debug_dir: /home/manipulator/git/point-to-pose/debug/criterion

local_optimizer:
  type: lm_graph
  params:
    local_graph_max_num_frames: 20
    max_iterations: 20
    relative_error_tol: 1e-5
    absolute_error_tol: 1e-5
    prior_noise_param: [0.0000, 0.0000, 0.0000, 0.0000, 0.0000, 0.0000]
    uncertainty_thres: 0.3
    uncertainty_min: 1e-2
    use_between_factor: true
    landmark_sigma_scale_by: none
    landmark_sigma_min: 1e-3
    landmark_huber_k: 1.0

global_optimizer:
  type: lm_graph
  params:
    relinearize_threshold: 0.1
    relinearize_skip: 1
    relative_error_tol: 1e-5
    absolute_error_tol: 1e-5
    prior_noise_param: [0.0000, 0.0000, 0.0000, 0.0000, 0.0000, 0.0000]
    uncertainty_thres: 0.3
    uncertainty_min: 1e-2
    use_between_factor: true
    landmark_sigma_scale_by: residual
    landmark_sigma_min: 1e-3
    landmark_huber_k: 1.0

visualization:
  params:
    visualize_points: true
    # uncertainty, visible, visible_valid, visible_uncertainty, registration_used_valid, registration_correspondence, frame_id
    points_vis_method: visible_uncertainty
    save_images: false
    output_image_dir: /home/manipulator/git/point-to-pose/debug/output_images
    save_final_sdf_on_exit: true
    final_sdf_output_dir: /home/manipulator/git/point-to-pose/debug/final_sdf

lcm:
  rgbd_channel: d455_1
  camera_info_channel: d455_1_info
  obj_pose_bb2world_channel: hw_obj_pose
  obj_pose_mesh2world_channel: hw_obj_mesh_pose
  sub_poll_hz: 500.0
  pub_hz: 60.0
  drop_stale_frames: true
  max_frame_drain: 8
  window_name: Point2Pose LCM Tracker
  verbose: false

viser:
  host: 0.0.0.0
  port: 8080
  mesh_watch_dir: /home/manipulator/git/point-to-pose/debug/sdf_mesh
  mesh_poll_hz: 2.0
  filter_disconnected: true
  show_bbox: true
  show_axes: true
  show_labels: true
  show_world_frame: true
