realsense:
  params:
    rs_serial: 941322070969
    width: 640
    height: 480
    color_fps: 60
    depth_fps: 60
    # Reduce latency by keeping the RealSense queues short and draining to the newest frame.
    frames_queue_size: 1
    drop_stale_frames: true
    max_frame_drain: 8
    timing_debug_every: 30
    # Motion blur is mostly driven by the RGB exposure time.
    # To reduce blur:
    # 1. try color_fps: 60 if your camera supports it
    # 2. set color_auto_exposure: false
    # 3. lower color_exposure_us (for example 4000-8000)
    # 4. raise color_gain if the image becomes too dark
    color_auto_exposure: true
    color_auto_exposure_priority: false
    color_exposure_us: 100
    color_gain: null
    color_sharpness: null
    depth_emitter_enabled: true


pipeline:
  type: modular
  params:
    # Bounding-box estimation modes:
    #   first_frame_dense: estimate bbox + init pose from the first frame dense mask cloud
    #   continuous: update bbox automatically from the configured source over time
    #   manual: only update bbox when the RealSense example receives the 'b' key
    bbox_estimation_mode: manual
    # Source used by continuous/manual modes: keypoints | sdf
    bbox_estimation_source: sdf
    # Outlier rejection: none | mad | dbscan | mad_dbscan
    bbox_outlier_rejection: mad_dbscan
    bbox_min_points: 12
    bbox_max_points: 6000
    bbox_mad_scale: 3.5
    bbox_dbscan_eps: 0.02
    bbox_dbscan_min_points: 8
    bbox_fit_minimal_obb: true

    use_segmenter: true
    sync_timing_cuda: true
    retire_invalid_tracks: false
    retire_protect_keyframe_tracks: false

    # depth related
    fill_missing_depth: true
    fill_missing_depth_window_size: 5
    fill_missing_depth_min_neighbors: 1
    min_depth: 0.1
    max_depth: 2

    use_depth_estimate: false
    depth_estimator_type: depth_anything
    device: cuda
    depth_encoder: vitl

    max_rel_rotation_deg: 30
    max_rel_translation: 0.1
    pose_jump_guard_enable: true
    pose_jump_guard_trans_thres: 0.1
    pose_jump_guard_rot_deg_thres: 30.0
    pose_jump_guard_min_inliers: 5
    pose_jump_guard_min_inlier_ratio: 0.0
    pose_jump_guard_single_cluster_min_inliers: 5

    pose_filter_enable: true
    pose_filter_type: lowpass
    pose_filter_nominal_dt: 0.0066667
    pose_filter_min_dt: 0.0083333
    pose_filter_max_dt: 0.1000000
    pose_filter_skip_on_jump_reject: true
    pose_filter_log_raw_pose: false
    pose_filter_rot_smooth_alpha: 0.3
    pose_filter_mask_trans_trust: 0.8
    pose_filter_rot_process_sigma: 0.087
    pose_filter_trans_process_sigma: 0.02
    pose_filter_lowpass_alpha: 0.95        # smoothing factor (smaller = more smoothing)
    # pose_filter_lowpass_window_size: 3  # optional: use moving average instead of exponential smoothing

    pose_filter_outlier_rejection: false
    pose_filter_outlier_trans_thres: 0.1    # meters (default 0.1)
    pose_filter_outlier_rot_deg_thres: 30.0 # degrees (default 30.0)

    mask_pose_fallback_enable: true
    mask_pose_fallback_only_when_weak: true
    mask_pose_fallback_weak_min_valid_points: 3
    mask_pose_fallback_weak_min_inliers: 3
    mask_pose_fallback_weak_mean_residual: 0.01
    mask_pose_fallback_use_on_lost: false
    mask_pose_fallback_use_on_jump_reject: true
    mask_pose_fallback_center_mode: bbox
    mask_pose_fallback_use_mask_depth: true
    mask_pose_fallback_depth_blend: 0.5
    mask_pose_fallback_min_mask_area: 64
    mask_pose_fallback_min_depth_samples: 16
    mask_pose_fallback_max_mask_pixels: 4096
    mask_pose_fallback_gain: 1.0
    mask_pose_fallback_max_translation_step: 0.10
    mask_pose_fallback_clear_lost_on_apply: true

    kf_gating: false
    anchor_rot_deg: 15.0
    anchor_trans: 0.03
    anchor_min_inliers: 4
    anchor_min_inlier_ratio: 0.0
    anchor_max_median_res: 0.01
    anchor_vel_hist_len: 5
    anchor_vel_rot_deg: 150.0
    anchor_vel_trans: 1.00

    sdf_kf_gate : false
    sdf_kf_gate_thres: 0.05
    sdf_kf_gate_percentile: 70.0
    sdf_kf_gate_min_dense: 200


    # frame-level growth gate
    map_growth_gate: false
    map_growth_cooldown_after_recovery: 3
    map_growth_max_mean_residual: 0.007

    # Frontend fallback: if confirmed valid correspondences are too few,
    # temporarily use recent tentative points that pass quality checks.
    tentative_fallback_min_valid_points: 12
    tentative_fallback_max_points: 16
    tentative_fallback_recent_frames: 20
    tentative_fallback_uncer_scale: 1.5

    # pending promotion geometry consistency
    pending_obs_min_count: 4
    pending_obs_max_keep: 8
    pending_obj_spread_thres: 0.008          # meters
    pending_use_view_diversity: true
    pending_min_view_angle_deg: 5.0
    pending_kf_min_promoted_ratio: 0.3
    pending_kf_min_promoted_count: 8
    pending_kf_ttl: 30
    pending_kf_ttl_on_growth_frames: true
    pending_kf_require_reg_quality: true
    pending_kf_require_pose_stable: true
    pending_kf_sdf_gate: false
    pending_kf_sdf_gate_thres: 0.02

    # pending promotion SDF gate (optional)
    pending_sdf_gate: false
    pending_sdf_gate_thres: 0.02
    pending_sdf_gate_percentile: 100.0
    pending_sdf_min_support: 1.0
    pending_use_geom_check: true
    pending_reset_on_bad: true

    # newly promoted point warmup trust
    promoted_warmup_frames: 1
    promoted_init_uncer: 0.2
    promoted_min_uncer: 0.1
    promoted_spread_to_uncer: 0.00
    promoted_uncer_decay: 0.00

    frame_reg_mode: f2m
    use_dense_registration: false
    use_local_graph: false

    debug_level: 0
    debug_dir: /home/manipulator/git/point-to-pose/debug/
    save_pose: true
    pose_save_path: /home/manipulator/git/point-to-pose/debug/poses
    save_key_points: false
    key_points_save_path: /home/manipulator/git/point-to-pose/debug/key_points
    save_meta_data: true
    meta_data_log_every: 5
    meta_data_max_rows: -1
    meta_data_save_path: /home/manipulator/git/point-to-pose/debug/pipeline/meta_data
    save_cropped_pcd: false
    cropped_pcd_dir: /home/manipulator/git/point-to-pose/debug/cropped_pcd
    sdf_mesh_save_every: 5
    sdf_mesh_save_dir: /home/manipulator/git/point-to-pose/debug/sdf_mesh

reconstructor:
  type: sdf_builder
  params:
    build_sdf_after_global_opt: true
    sdf_use_gpu: true
    sdf_backend: python_tsdf
    sdf_voxel_size: 0.005
    sdf_bounds_padding: 0.1
    sdf_max_voxels: 20000
    sdf_max_extent_m: 1.0
    sdf_min_points: 300
    sdf_filter_max_radius: 0.25
    sdf_filter_keep_percentile: 98.0
    sdf_fuse_color: true
    
register:
  type: svd_residual_outlier
  # type: svd_cluster_ransac
  params:

    threshold_method: mad

    ransac_iters: 100
    sample_size: 4
    inlier_thres: 0.006 #0.004
    min_inliers: 5
    max_clusters: 10
    use_uncertainty: true
    min_variance: 1e-2
    select_3d_dist_min_depth: 0.08
    select_3d_dist_max_depth: 2
    select_3d_dist_fill_missing_depth: true
    select_3d_dist_window_size: 5
    select_3d_dist_min_neighbors: 1
    select_dense_map_close_margin: 0.01

    # reproj_error, dist_to_prev, inlier_count, mean_residual, reproj_error_iou, 3d_dist,
    # 3d_dist_prev_kf, 3d_dist_sparse_map, 3d_dist_dense_map, 3d_dist_dense_map_hybrid
    select_method: 3d_dist_dense_map
    select_support_guard_enable: true
    select_support_guard_min_rel_ninliers: 0.25
    select_support_guard_abs_min_ninliers: 8
    select_support_guard_keep_rel_ninliers: 0.70
    select_support_guard_pose_weight: 0.05
    select_dense_map_hybrid_robust_percentile: 90.0
    select_dense_map_hybrid_sdf_tau: 0.01
    select_dense_map_hybrid_min_support: 0.05
    select_dense_map_hybrid_min_inlier_ratio: 0.05
    select_dense_map_hybrid_sdf_gate_margin: 0.005
    select_dense_map_hybrid_w_sdf: 0.60
    select_dense_map_hybrid_w_prev: 0.20
    select_dense_map_hybrid_w_motion: 0.15
    select_dense_map_hybrid_w_ransac: 0.05

    # Optional post-selection pose refinement with SDF loss.
    enable_sdf_refine: true
    sdf_refine_iters: 8
    sdf_refine_damping: 1e-4
    sdf_refine_grad_eps: 0.5
    sdf_refine_max_pts: 1500
    sdf_refine_use_dense_cur: true
    sdf_refine_min_pts: 30
    sdf_trim_method: mad
    sdf_mad_scale: 2.5
    sdf_inlier_thres: 0.01
    sdf_inlier_percentile: 80.0
    sdf_kernel: huber
    sdf_kernel_delta: 0.01
    sdf_min_support_ratio: 0.15
    sdf_bad_penalty: 0.05
    sdf_refine_step_trans_clip: 0.02
    sdf_refine_step_rot_clip: 0.2

    # front end
    remove_outside_mask: true
    uncer_thres: 0.3
    residual_thres: 0.007

dense_register:
  type: cupoch_icp
  params:
    icp_type: point_to_plane
    min_num_points: 5
    max_num_points: 10000
    max_correspondence_distance: 0.05
    max_iterations: 30
    epsilon: 1e-6
    debug_level: 0
    debug_dir: /home/manipulator/git/point-to-pose/debug/dense_register

recovery:
  type: recovery_manager
  params:
    max_lost_frames: 1
    min_recovery_overlap: 10
    # force f2m registration every n frames, set to -1 to disable
    update_every: -1

segmenter:
  type: sam2
  params:
    model_cfg: configs/sam2.1/sam2.1_hiera_l.yaml
    checkpoint: /home/manipulator/git/point-to-pose/checkpoints/sam2.1/sam2.1_hiera_large.pt
    device: cuda
    vos_inference: true
    apply_postprocessing: false
    compile_memory_encoder: true
    # compile_memory_attention: true
    compile_prompt_encoder: true
    compile_mask_decoder: true

tracker:
  type: tapir
  params:
    resize_height: 480
    resize_width: 480
    visible_threshold: 0.5
    query_chunk_size: 2048
    enable_tf32: true
    device: cuda
    checkpoint_path: /home/manipulator/git/point-to-pose/checkpoints/tapir/causal_bootstapir_checkpoint.pt

