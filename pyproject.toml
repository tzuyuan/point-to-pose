[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "point2pose" # this becomes your import namespace
version = "0.1.0"
description = "Real-time 6D Object Pose Estimation from 2D Point Tracking"
authors = [{ name = "Tzu-Yuan Lin" }]
dependencies = [
    "omegaconf",
    "pyrealsense2",
    "torch",
    # add other core dependencies
]

[tool.setuptools.packages.find]
where = ["point2pose"]

[tool.setuptools]
package-dir = { "" = "point2pose" }
