# Point2Pose environment.
#
#   conda env create -f environment.yml
#   conda activate point2pose
#
# Nothing gets installed as a package: every entry-point script adds the
# repository root to sys.path, so just run them from the repository root, e.g.
#
#   python examples/realsense_tracking/realsense_tracking.py
#   python experiments/ho3d/run_ho3d_single.py -v AP12 ...
#
# Two things still need to happen after this (see the README):
#   1. pip install --no-build-isolation -r requirements-third-party.txt
#   2. download the SAM2 / TAPIR checkpoints
#
# Pins mirror requirements.txt (that file is for plain pip/venv users).
name: point2pose
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=24.0
  - pip:
      # CUDA 12.1 builds of torch; drop this line for the PyPI default.
      - --extra-index-url https://download.pytorch.org/whl/cu121

      # core pipeline
      - numpy==2.1.3            # <2.3 for numba, >=2 for rerun-sdk
      - scipy==1.15.2
      - opencv-python==4.11.0.86
      - omegaconf==2.3.0
      - torch==2.4.0
      - torchvision==0.19.0
      - open3d==0.19.0
      - trimesh==4.6.9
      - scikit-image==0.25.2
      - numba==0.61.2
      - matplotlib==3.10.0
      - gtsam==4.3a0

      # live RealSense demo
      - pyrealsense2==2.55.1.6486

      # 3D visualization dashboards
      - rerun-sdk==0.36.0
      - viser==1.0.8
      - plotly==6.0.1
      - imageio==2.37.0
      - imageio-ffmpeg==0.6.0

      # optional: CUDA TSDF fusion (needs nvcc), Track-On2 backend, LCM output
      # - pycuda==2025.1.2
      # - transformers==4.56.1
      # - lcm==1.5.1
